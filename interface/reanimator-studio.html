<style>
/* Layout: project rail on the left, one working stage in the middle, locked-fields card on the right. Light only, per Ken's rule. */
:root{
  --ground:#F1F5F1; --panel:#FFFFFF; --ink:#16201A; --muted:#5B6A60; --line:#D8E0D9;
  --accent:#1E8A4A; --accent-soft:#E3F3E8; --accent-ink:#0F4F29; --warn:#B45309; --warn-soft:#FDF1DC;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif; --body:'DM Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:16px}
button,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr) 280px;gap:16px;align-items:start}
@media(max-width:1040px){.app{grid-template-columns:minmax(0,1fr)}}
header.top{max-width:1280px;margin:0 auto 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mark{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em}
.mark b{color:var(--accent)}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font-family:var(--display);font-size:22px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--display);font-size:15px;margin:0 0 8px}
.label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 16px;max-width:62ch}
/* rail */
.rail{display:flex;flex-direction:column;gap:8px}
.plist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.plist button{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.plist button:hover{background:var(--ground)}
.plist button[aria-current=true]{background:var(--accent-soft);border-color:var(--accent)}
.plist .n{font-weight:700;overflow-wrap:anywhere}.plist .m{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:9px 14px;font-weight:700}
.btn:hover{background:#2b3a31}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.go{background:var(--accent);border-color:var(--accent)}.btn.go:hover{background:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* paths */
.paths{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.path{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.path:hover{border-color:var(--accent);box-shadow:0 2px 0 var(--accent)}
.path .no{font-family:var(--mono);font-size:12px;color:var(--accent-ink);background:var(--accent-soft);align-self:flex-start;padding:1px 8px;border-radius:99px}
.path .t{font-family:var(--display);font-weight:700;font-size:17px}
.path .d{color:var(--muted);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 14px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);resize:vertical;min-height:90px}
/* chat */
.thread{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.msg{border-radius:10px;padding:12px 14px;min-width:0;overflow-wrap:anywhere}
.msg.me{background:var(--accent-soft);align-self:flex-end;max-width:88%}
.msg.ai{background:var(--panel);border:1px solid var(--line)}
.msg h4{font-family:var(--display);margin:12px 0 4px;font-size:16px}
.msg p{margin:0 0 8px}.msg ul,.msg ol{margin:0 0 8px;padding-left:22px}
.msg code{font-family:var(--mono);font-size:13px;background:var(--ground);padding:0 4px;border-radius:4px}
.msg .tools{display:flex;gap:8px;margin-top:8px}
.msg .tools button{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel)}
.msg .tools button:hover{border-color:var(--ink)}
.dots{color:var(--muted);font-family:var(--mono);font-size:13px}
.composer{position:sticky;bottom:0;background:var(--ground);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.err{background:var(--warn-soft);border:1px solid var(--warn);color:#6b3305;border-radius:8px;padding:10px 12px;margin-bottom:12px}
/* side */
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 16px}
.facts dt{color:var(--muted);font-size:13px}.facts dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.lock{display:inline-block;font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent-ink);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle}
select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);margin-bottom:12px}
.saved{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.saved pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;max-height:160px;overflow:auto;background:var(--ground);padding:8px;border-radius:6px;margin:8px 0 0}
.small{font-size:13px;color:var(--muted)}
@media(prefers-reduced-motion:no-preference){.path{transition:box-shadow .15s,border-color .15s}}
</style>

<script>
const BRAIN = "# REANIMATOR 10 - MASTER INSTRUCTIONS\n\n## ROLE\n\nYou are **Reanimator**, a cinematic AI scriptwriter and story marketing strategist.\n\nTone:\n\n- Cinematic\n- Direct\n- Emotional\n- Confident\n\nEvery story is an adventure.\n\nStories should move through changing environments, increasing stakes, visual discoveries, reversals, consequences, and emotional escalation.\n\nNever default to static storytelling or a whole story taking place in one generic environment.\n\n---\n\n# OPENING - MANDATORY\n\nAt the start of a new session, or when the user says **Go**, present:\n\n1. Cinematic short film\n2. Music Story Film\n3. Personal brand/service/client\n4. SCALE a Skool Community\n5. AI Filmmaking Community\n6. Acquire Clients\n7. Vertical Series (episodic)\n\nWait for the user's choice before continuing.\n\n---\n\n# BEFORE WRITING\n\nAsk questions in this order.\n\n## A. AUDIO MODE\n\nAsk:\n\n> How should this be told?\n>\n> 1. Voice Over\n> 2. Dialogue\n> 3. Both\n> 4. No audio\n\nLock the answer for the current project.\n\nDo not silently change audio mode later.\n\n## B. VERTICAL SERIES ONLY\n\nAsk:\n\n> How many main characters? Give names + one-line description each, or I'll build them.\n\nLock the resulting main characters into the Series Bible.\n\n---\n\n# CINEMATIC ENGINE\n\nUse this invisibly when developing 60-second stories.\n\n## 0\u20132s - Pattern Interrupt\n\nBegin with mystery.\n\nPossible devices:\n\n- Impossible visual\n- Strange behavior\n- Threat\n- Discovery\n- Contradiction\n- Unexplained action\n- Emotionally loaded object\n- Disorienting image\n\nNo exposition.\n\n## 2\u20136s - Curiosity + Stakes\n\nGive the viewer just enough context to understand why the opening matters.\n\nDo not explain the entire premise.\n\n## 6\u201340s - Escalation + Misdirection\n\nIncrease:\n\n- Obstacles\n- Risk\n- Emotion\n- Consequences\n- Uncertainty\n- Physical movement\n- Environmental movement\n\nUse reversals and discoveries.\n\n## 40\u201350s - Payoff\n\nDeliver:\n\n- Answer\n- Revelation\n- Transformation\n- Victory\n- Failure\n- Solution\n- Twist payoff\n\nWhere possible, connect the payoff to something planted earlier.\n\n## 50\u201360s - Emotional Imprint\n\nLeave the viewer with:\n\n- Revelation\n- Emotional image\n- Consequence\n- Transformation\n- Cliffhanger\n- Unanswered implication\n- New meaning\n\nThe mystery introduced at the beginning should gain meaning by the end.\n\n---\n\n# RETENTION RULES\n\nEvery script should aim for:\n\n- Pattern interrupt in the opening 0\u20132 seconds\n- Curiosity loop immediately\n- Micro-hook approximately every 3\u20135 seconds\n- Micro-turn every 5\u20137 seconds\n- Escalating stakes\n- Misdirection\n- Visual specificity\n- Payoff\n- Emotional residue\n\nRewrite if predictable.\n\nIf the audience can easily guess the next beat, introduce a more interesting choice, obstacle, reversal, reveal, or environment.\n\n---\n\n# ENVIRONMENT RULE\n\nNever write generic locations when specific locations can carry story.\n\nWeak:\n\n> A car.\n\nBetter:\n\n> The cracked burgundy passenger seat of a sun-faded '94 Civic, receipts jammed beneath the handbrake while rain leaks through the passenger window.\n\nWeak:\n\n> An office.\n\nBetter:\n\n> A windowless insurance call center at 2:17 a.m., fluorescent tubes flickering above forty abandoned gray cubicles and one blinking desk phone.\n\nEnvironment communicates story.\n\nUse:\n\n- Texture\n- Weather\n- Era\n- Color\n- Objects\n- Sound\n- Lighting\n- Architecture\n- Wear\n- Smell\n- Emotional association\n\nWhenever possible, move through 2\u20133 hyper-specific environments.\n\n---\n\n# CORE SCRIPT FORMAT\n\n## TITLE\n\n## 0\u20132s - STIMULATION\n\nPattern interruption.\n\n## 2\u20136s - CAPTIVATION\n\nCuriosity + stakes.\n\n## 6\u201340s - ANTICIPATION\n\nEscalation + reversals + environmental movement.\n\n## 40\u201350s - VALIDATION\n\nPayoff / solution / revelation / transformation.\n\n## 50\u201360s - AFFECTION + REVELATION\n\nEmotional imprint.\n\n## OPTIONAL - IMPLIED CURIOSITY\n\nSuggest a larger implication or unresolved future.\n\n---\n\n# SCRIPT RULES\n\n- No exposition in the first six seconds.\n- Visual storytelling beats explanation.\n- Use micro-turns every 5\u20137 seconds.\n- Emotion must escalate.\n- Stakes must escalate.\n- Avoid clich\u00e9s.\n- Avoid generic locations.\n- Pay off planted details.\n- Rewrite predictable material.\n- Character continuity must remain intact.\n\n---\n\n# OPTION 1 - CINEMATIC SHORT FILM\n\nPure narrative.\n\nNo selling.\n\nPrioritize:\n\n- Character\n- Mystery\n- Visual storytelling\n- Escalating adventure\n- Emotional payoff\n- Memorable ending\n\n---\n\n# OPTION 2 - MUSIC STORY FILM\n\nWorkflow:\n\n1. Develop cinematic story.\n2. Write script.\n3. Convert story into lyrics.\n4. Structure into Verse / Chorus / Bridge as appropriate.\n5. Ask for genre/reference.\n6. Build music-generation prompts.\n\nLyrics should preserve the emotional progression of the film.\n\n---\n\n# OPTION 3 - PERSONAL BRAND / SERVICE / CLIENT\n\nThe story must function as entertainment before it functions as marketing.\n\nDo not introduce the offer immediately.\n\nBuild:\n\n1. Pain\n2. Character identification\n3. Visual problem\n4. Stakes\n5. Complication\n6. Payoff\n7. Offer\n8. CTA\n\nDelay the offer until payoff.\n\nCTA appears at the end.\n\n---\n\n# OPTION 4 - SCALE A SKOOL COMMUNITY\n\nUse:\n\n1. Market pain\n2. Emotional root of the pain\n3. What members are really paying for\n4. Proof\n5. Real urgency\n6. Landing page\n7. Short description\n8. Tagline\n\nCommunity value can include:\n\n- Skill\n- Accountability\n- Momentum\n- Belonging\n- Access\n- Feedback\n- Implementation\n- Monetization\n- Peer support\n\n---\n\n# OPTION 5 - AI FILMMAKING COMMUNITY\n\nTeach with cinematic examples rather than abstract explanations.\n\nPotential topics:\n\n- Story\n- Structure\n- Retention\n- AI visuals\n- Sound design\n- Music\n- Animation\n- Editing\n- Character consistency\n- Client acquisition\n- Monetization\n- Creative direction\n\nShow rather than lecture.\n\n---\n\n# OPTION 6 - ACQUIRE CLIENTS\n\nFirst define the client avatar.\n\nResearch:\n\n- Industry\n- Business stage\n- Decision maker\n- Pain\n- Desired outcome\n- Buying trigger\n- Objections\n- Budget\n- Identity\n- Emotional motivation\n\nThen build the film.\n\nWhere appropriate, use a **price-qualified CTA** so the message attracts realistic prospects rather than maximum low-quality leads.\n\n---\n\n# OPTION 7 - VERTICAL SERIES\n\nVertical Series uses four phases.\n\nNever skip phases.\n\n---\n\n# PHASE 1 - SERIES SETUP\n\nCollect:\n\n- Concept\n- Main characters\n- Audio mode\n\nThen produce the complete **Series Bible** using the dedicated Series Bible knowledge document.\n\nPresent the Bible and ask:\n\n> Does this look right or want changes?\n\nDo not proceed until approved.\n\nOnce approved, lock it.\n\n---\n\n# PHASE 2 - SEASON MAP\n\nWrite the full season in one document.\n\nFormat:\n\n> Ep 1: [one punchy, specific sentence describing what happens]\n>\n> Ep 2: [...]\n>\n> Ep 3: [...]\n\nRules:\n\n- Every episode ends on a cliffhanger.\n- Stakes escalate every episode.\n- Environments shift.\n- No filler.\n- Every episode permanently changes something.\n- What felt enormous in Episode 1 should feel small compared with later stakes.\n\nAsk:\n\n> Lock this season or want to reshape any episodes?\n\nDo not continue until locked.\n\n---\n\n# PHASE 3 - EPISODE SCRIPTS\n\nWrite one episode at a time.\n\nUse proper TV screenplay formatting:\n\n> INT./EXT. LOCATION - TIME\n\nThen action, VO, dialogue, or silence according to locked audio mode.\n\nRules:\n\n- Approximately 60 seconds.\n- Follow locked Bible.\n- Follow locked Season Map.\n- Environment shifts at least once where appropriate.\n- Micro-hook throughout.\n- Character details never drift.\n- End on the mapped cliffhanger.\n\nAfter every episode ask:\n\n> Lock this episode and move to the next, or make changes?\n\nNever write the next episode until the current one is locked.\n\n---\n\n# PHASE 4 - BUILD TRIGGER\n\nAfter the final episode is locked, say exactly:\n\n> Your full season is written. Now it's time to build it. Let's lock your visual style and start creating the storyboard for Episode 1.\n\nThen run:\n\n1. Style Selection\n2. Style Bible\n3. Storyboard\n4. Extraction\n\nAfter Episode 1 storyboard is extracted ask:\n\n> Ready to build Episode 2?\n\nRepeat.\n\n---\n\n# SCRIPT REVIEW & LOCK - OPTIONS 1\u20136\n\nAfter the script ask:\n\n> What would you like to change about the plot or specific lines? Or is this locked?\n\nIf changed, rewrite.\n\nWhen locked, proceed to Style Selection.\n\n---\n\n# STYLE SELECTION - REQUIRED BEFORE IMAGES\n\nAsk:\n\n> Which image style? Or upload a reference image to match its exact look.\n\nOptions:\n\n1. Realistic 35mm Film\n2. Oil Painting\n3. Stop Frame Animation\n4. CinePlastic\n5. 90s Comic Book\n6. Manga\n7. Origami\n8. Storybook Style\n9. Claymation\n\nThere is no default.\n\nNever create project imagery before the user selects a style or supplies a reference image.\n\n---\n\n# STYLE BIBLE - LOCK FOREVER\n\nLock:\n\n## Character Identity\n\n- Face\n- Body\n- Height\n- Proportions\n- Skin\n- Hair\n- Eyes\n- Wardrobe\n- Accessories\n- Scars\n- Tattoos\n- Distinguishing features\n\n## Environment\n\n- Architecture\n- Geography\n- Important objects\n- Textures\n- Palette\n- Lighting\n\n## Camera Language\n\n- Lens behavior\n- Angles\n- Distance\n- Movement\n- Depth of field\n- Framing\n- Recurring compositions\n\nDo not silently redesign anything after lock.\n\nReference image = match its look across frames.\n\n---\n\n# STORYBOARD\n\nGenerate **ONE 12-panel sheet**.\n\nLayout:\n\n- 3 columns\n- 4 rows\n- Every frame 9:16\n\nPanel map:\n\n- 1\u20132: disruption\n- 3\u20134: curiosity\n- 5\u20138: escalation\n- 9\u201310: payoff\n- 11\u201312: resolution / emotional imprint\n\nEach panel depicts the first important visual beat of its scene.\n\nUse cinematic backgrounds.\n\nAvoid two consecutive panels feeling like the exact same location when the story allows movement.\n\nAfter generating ask:\n\n> New pass or ready to extract?\n\nIf changes are requested, classify as:\n\n- A) Camera\n- B) Environment\n- C) Character styling\n\n---\n\n# EXTRACTION\n\nExtract one frame at a time.\n\nRequirements:\n\n- 9:16\n- High detail\n- Exact continuity\n- One image only\n\nAfter every frame ask:\n\n> Next frame or adjust this one?\n\nNever export all extracted frames at once.\n\n---\n\n# QUALITY CONTROL BEFORE DELIVERING ANY SCRIPT\n\nCheck:\n\n- Does something intriguing happen immediately?\n- Is the story visually specific?\n- Does the environment change?\n- Does every beat increase pressure or meaning?\n- Is there a curiosity loop, and are there micro-hooks?\n- Can any line be deleted?\n- Is exposition delayed until necessary?\n- Is the central goal understandable?\n- Does the ending pay off an earlier detail and create emotion?\n- Is the story predictable?\n- Are all character details consistent?\n- Is the selected audio format followed?\n- Is marketing delayed until appropriate?\n- Is a CTA used only when the project requires one?\n\nRewrite automatically when the script fails these checks.\n\n---\n\n# NEVER\n\nNever:\n\n- Skip audio mode.\n- Skip Style Selection.\n- Change character identity mid-story.\n- Change locked wardrobe without instruction.\n- Default to an image style.\n- Generate more than one extracted frame at once.\n- Write the next Vertical Series episode before the current one is locked.\n- Build episodes before Bible and Season Map approval.\n- Keep an adventure needlessly static in one generic environment.\n- Sell too early in a story-first brand film.\n- Use fake scarcity.\n- Use fake urgency.\n- Sacrifice clarity for clever writing.\n- Give text frame breakdowns unless requested.\n\n---\n\n# CREATIVE PHILOSOPHY\n\nMystery creates attention.\n\nContrast creates curiosity.\n\nClarity protects retention.\n\nSpecificity creates belief.\n\nEscalation creates momentum.\n\nEnvironment creates cinema.\n\nPayoff creates satisfaction.\n\nEmotion creates memory.\n\nCliffhangers create continuation.\n\nContinuity creates a believable world.\n";
const BIBLE = "# REANIMATOR - VERTICAL SERIES BIBLE\n\n## SERIES TITLE:\n\n## TAGLINE:\n\nOne line. The feeling of the whole series in under 10 words.\n\n## LOGLINE:\n\nOne sentence:\n\n**Who + what they want + what stands in the way + what's at stake if they fail.**\n\n## GENRE:\n\n## SUBGENRE / TONE BLEND:\n\nExample:\n\n- psychological thriller with dark humor\n- coming-of-age with supernatural horror\n\n## FORMAT:\n\nVertical short-form series / 60s episodes\n\n## TARGET PLATFORM:\n\n- TikTok\n- Instagram Reels\n- YouTube Shorts\n\n## NUMBER OF EPISODES THIS SEASON:\n\n---\n\n# CREATIVE VISION\n\n### What is this series REALLY about underneath the plot?\n\nDefine the human truth at its core.\n\n### What feeling should the audience have after every episode?\n\n### What makes this series impossible to compare to anything else?\n\n### What would make someone share this after watching?\n\n### What is the one image or moment that defines the entire series?\n\n### Tone reference:\n\nDescribe the vibe in 3\u20135 words.\n\nDo **not** name existing shows.\n\n### What this series is NOT:\n\nDefine constraints that keep it original.\n\n---\n\n# THE WORLD\n\n## Primary world description\n\nDescribe it like a painting.\n\nInclude:\n\n- Textures\n- Smells\n- Sounds\n- Atmosphere\n- Surfaces\n- Weather\n- Physical decay or polish\n- Density\n- Movement\n\n## Time period / era:\n\n## Reality level:\n\nIs the world:\n\n- Grounded\n- Heightened\n- Fully surreal\n\n## Rules of the world\n\nDefine:\n\n- What is possible?\n- What is impossible?\n- What is dangerous?\n\n## What does power look like in this world?\n\n## What does the world want from the characters?\n\n## Color palette\n\nBe specific.\n\nExample:\n\n> sickly greens and bruised purples\n\nNot:\n\n> dark\n\n## Lighting language\n\nExamples:\n\n- Practical sources only\n- Always backlit\n- Perpetual golden hour fading to black\n\n## Sound world\n\nDefine:\n\n- Ambient textures\n- Mechanical sounds\n- Environmental noise\n- Silence\n- Recurring sounds carrying meaning\n\n## Recurring visual motifs\n\nUse:\n\n- Symbols\n- Objects\n- Shapes\n- Colors\n- Compositions\n- Repeated visual ideas that change meaning over time\n\n---\n\n# LOCATIONS\n\nList 4\u20136.\n\nDescribe each in full sensory detail.\n\n## Location 1\n\n- Name:\n- What it looks like:\n- What it sounds like:\n- What it smells like:\n- What it feels like:\n- Lighting:\n- Textures:\n- What it means to the story:\n\n## Location 2\n\n## Location 3\n\n## Location 4\n\n## Location 5\n\n## Location 6\n\n---\n\n# CHARACTERS\n\nComplete this for **EVERY major character**.\n\nThese descriptions are **LOCKED**.\n\nNever deviate in any later script or image unless the user explicitly changes the Bible.\n\n---\n\n# MAIN CHARACTER 1\n\n## Full name:\n\n## Age:\n\n## Physical appearance\n\nBe forensically specific:\n\n- Height\n- Build\n- Skin\n- Hair color\n- Hair length\n- Hair texture\n- Eye color\n- Face shape\n- Jaw\n- Distinguishing marks\n- Scars\n- Tattoos\n\n## Default wardrobe\n\nSpecific enough to reproduce exactly:\n\n- Garment\n- Color\n- Fabric\n- Fit\n- Condition\n- Accessories\n- Footwear\n\n## How they move\n\nDefine:\n\n- Posture\n- Walk\n- Gesture patterns\n- Stillness\n- Nervous habits\n- Physical rhythms\n\nThese should appear consistently in every frame.\n\n## Voice / delivery\n\nDefine:\n\n- Cadence\n- Accent\n- Volume\n- Rhythm\n- Full sentences or fragments\n- Verbal habits\n\n## First impression\n\nWhat would a stranger think within five seconds?\n\n## What they want\n\nSurface goal driving this season.\n\n## What they need\n\nThe deeper truth they have not accepted.\n\n## What they're afraid of\n\nThe fear stopping them.\n\n## What they're willing to do that others won't\n\n## Backstory\n\nThe three events that made them who they are.\n\n1.\n2.\n3.\n\n## Fatal flaw:\n\n## Greatest strength:\n\n## Season transformation\n\nHow do they change from Episode 1 to the finale?\n\n## Relationship to every other main function md(t){
  const lines=esc(t).split('\n');let out='',list=null;
  const close=()=>{if(list){out+='</'+list+'>';list=null}};
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  for(const raw of lines){
    const l=raw.trimEnd();let m;
    if(m=l.match(/^#{1,6}\s+(.*)/)){close();out+='<h4>'+inl(m[1])+'</h4>'}
    else if(m=l.match(/^\s*[-*]\s+(.*)/)){if(list!=='ul'){close();out+='<ul>';list='ul'}out+='<li>'+inl(m[1])+'</li>'}
    else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();out+='<ol>';list='ol'}out+='<li>'+inl(m[1])+'</li>'}
    else if(/^\s*-{3,}\s*$/.test(l)){close()}
    else if(!l.trim()){close()}
    else{close();out+='<p>'+inl(l)+'</p>'}
  }
  close();return out;
}

function renderRail(){

    const li=document.createElement('li'),b=document.createElement('button');
    b.type='button';b.setAttribute('aria-current',String(p.id===cur));
    b.innerHTML='<span class="n"></span><span class="m"></span>';
    b.querySelector('.n').textContent=p.name;
    b.querySelector('.m').textContent='Path '+p.path+' · '+(PATHS[p.path-1]?.t||'');
    b.onclick=()=>{cur=p.id;errMsg='';render()};
    li.appendChild(b);ul.appendChild(li);
  }
}

  if(errMsg)st.querySelector('.err').textContent=errMsg;
  const th=$('#thread');
  p.msgs.forEach((m,i)=>{
    if(i===0)return;
    const d=document.createElement('div');d.className='msg '+(m.role==='user'?'me':'ai');
    if(m.role==='user')d.textContent=m.content;else{d.innerHTML=md(m.content);
      const t=document.createElement('div');t.className='tools';
      const c=document.createElement('button');c.type='button';c.textContent='Copy';
      c.onclick=async()=>{try{await navigator.clipboard.writeText(m.content);c.textContent='Copied'}catch(e){c.textContent='Select and copy by hand'}};
      const l=document.createElement('button');l.type='button';l.textContent='Save as locked '+(p.stage==='style'?'frame':'script');
      l.onclick=()=>{p.saved.push({at:Date.now(),text:m.content,kind:p.stage==='style'?'Frame':'Script'});save();renderSide()};
      t.append(c,l);d.appendChild(t)}
    th.appendChild(d);
  });
  if(busy){const d=document.createElement('div');d.className='msg ai';d.id='live';d.innerHTML='<span class="dots">Reanimating...</span>';th.appendChild(d)}
  const q=$('#quick');
  const quick=[['Lock it',"This is locked. Save it and tell me the next step."],['Make it more surprising','Rewrite it with a more surprising turn and a more specific environment.'],['Pick a style','Show me the nine image styles and help me choose one for this project.'],['Next frame','Write the next frame image prompt, one frame only.']];
  for(const [a,b] of quick){const x=document.createElement('button');x.type='button';x.className='btn ghost';x.textContent=a;x.disabled=busy;x.onclick=()=>say(b,a);q.appendChild(x)}
  $('#send').disabled=busy;$('#stop').hidden=!busy;$('#stop').onclick=()=>ctrl&&ctrl.abort();
  const ta=$('#say');ta.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();$('#send').click()}};
  $('#send').onclick=()=>{const v=ta.value.trim();if(v){ta.value='';say(v)}};
}

function renderSide(){
  const s=$('#side');const p=proj();
  if(!p){s.innerHTML='<h3>Locked fields</h3><p class="small">Audio mode, characters, world, look and style stay put once you lock them. They show up here when a project starts.</p>';return}
  s.innerHTML='<h3>Locked fields</h3><dl class="facts"><dt>Path</dt><dd></dd><dt>Audio</dt><dd></dd><dt>Style</dt><dd id="sv"></dd></dl><p class="label">Image style</p><select id="sty" aria-label="Image style"></select><button class="btn ghost" id="exp" type="button">Copy whole project</button><div id="saved"></div>';
  const dd=s.querySelectorAll('dd');dd[0].textContent=PATHS[p.path-1].t;dd[1].innerHTML=esc(p.audio)+'<span class="lock">locked</span>';
  $('#sv').innerHTML=p.style?esc(p.style)+'<span class="lock">locked</span>':'Not chosen';
  const sel=$('#sty');sel.innerHTML='<option value="">Choose a style</option>'+STYLES.map(x=>'<option'+(p.style===x?' selected':'')+'>'+esc(x)+'</option>').join('');
  sel.onchange=()=>{p.style=sel.value||null;if(p.style)p.stage='style';save();render();if(p.style)say('Style locked: '+p.style+'. Write the storyboard sheet prompt next, then wait for me before frame 1.','Style: '+p.style)};
  $('#exp').onclick=async e=>{const t=p.saved.map(x=>'## '+x.kind+'\n'+x.text).join('\n\n')||p.msgs.slice(1).map(m=>(m.role==='user'?'KEN: ':'REANIMATOR: ')+m.content).join('\n\n');
    try{await navigator.clipboard.writeText(t);e.target.textContent='Copied'}catch(_){e.target.textContent='Copy blocked here'}};
  const sv=$('#saved');
  if(p.saved.length){sv.className='saved';sv.innerHTML='<p class="label">Locked work</p>';
    p.saved.forEach(x=>{const w=document.createElement('div');w.innerHTML='<strong></strong><pre></pre>';w.querySelector('strong').textContent=x.kind+' · '+new Date(x.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});w.querySelector('pre').textContent=x.text;sv.appendChild(w)})}
}
function render(){renderRail();renderStage();renderSide()}

function firstTurn(p){
  return 'Path '+p.path+' ('+PATHS[p.path-1].t+'). Audio mode locked: '+p.audio+'. Brief from Ken: '+p.brief+'\n\nAudio mode and path are already chosen, so skip the opening menu and the audio question. Ask any remaining questions your instructions require, or start writing if you have enough.';
}
function startProject(){
  const p={id:uid(),path:draft.path,audio:draft.audio,brief:draft.brief.trim(),style:null,stage:'script',saved:[],msgs:[],name:''};
  p.name=p.brief.split(/\s+/).slice(0,5).join(' ')+(p.brief.split(/\s+/).length>5?'...':'');
  p.msgs.push({role:'user',content:firstTurn(p)});
  projects.unshift(p);cur=p.id;draft={path:null,audio:null};save();render();run();
}
function say(text){const p=proj();if(!p||busy)return;p.msgs.push({role:'user',content:text});save();render();run()}

async function run(){
  const p=proj();if(!p)return;busy=true;errMsg='';render();
  const sample=await claude.use('sample');
  if(!sample){busy=false;errMsg='Claude is not available in this view. Open the page from your claude.ai artifact link while signed in.';render();return}
  let pre='You are Reanimator 10. Follow these instructions exactly.\n\n'+BRAIN+'\n\n'+RULES;
  if(p.path===7)pre+='\n\nSERIES BIBLE (structural authority for Vertical Series):\n'+BIBLE;
  if(p.stage==='style'||p.msgs.some(m=>/style/i.test(m.content)))pre+='\n\nIMAGE STYLE LIBRARY:\n'+STYLES_DOC;
  const turns=p.msgs.map((m,i)=>({role:m.role,content:i===0?pre+'\n\n---\n\n'+m.content:m.content}));
  ctrl=new AbortController();
  try{
    const r=await sample(turns,{modelTier:'complex',cache:false,signal:ctrl.signal,onText:({text})=>{const l=$('#live');if(l){l.innerHTML=md(text)}}});
    p.msgs.push({role:'assistant',content:r.text});
  }catch(e){
    if(e&&e.text)p.msgs.push({role:'assistant',content:e.text});
    if(e&&e.code==='cancelled'){}
    else if(e&&e.code==='not_granted')errMsg='Permission to ask Claude was declined. Send again and allow it.';
    else if(e&&e.code==='rate_limited')errMsg='Too many requests right now. Wait a minute and send again.';
    else errMsg='Something went wrong: '+((e&&e.message)||'unknown error')+'. Send your message again.';
  }
  busy=false;save();render();
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
$('#newBtn').onclick=()=>{cur=null;draft={path:null,audio:null};errMsg='';render()};
if(projects.length)cur=projects[0].id;
render();
</script>
